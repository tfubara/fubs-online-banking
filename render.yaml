services:
  - type: web
    name: fubs-online-banking
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fubs-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_DELIVERY_ENABLED
        value: "false"
      - key: FACE_VERIFICATION_ENABLED
        value: "false"
      - key: REAL_PAYMENTS_ENABLED
        value: "false"
databases:
  - name: fubs-postgres
    databaseName: fubs_banking
    user: fubs_user
